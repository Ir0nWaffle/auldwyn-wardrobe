server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Text files compress well; the .bin packs are already gzip inside.
    gzip on;
    gzip_types text/css application/javascript application/json;

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        # Rebuilt files keep their names, so browsers check for changes each visit.
        add_header Cache-Control "no-cache";
    }
}
